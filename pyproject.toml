[project]
name = "diffbot-agent"
version = "0.1.0"
description = "Long-running DiffBot command orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62.0",
    "mcp>=1.21.0",
    "openai-agents>=0.6.0",
    "protobuf>=4.25.0",
]

[project.scripts]
diffbot-agent = "diffbot_agent.main:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
