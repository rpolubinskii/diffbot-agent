active_agent = "openai-main"

[logging]
level = "info"

[agent_runtime]
busy_policy = "ignore"
max_turns = 1000
# OpenAI path: the Responses API compacts the context server-side once it crosses
# this token threshold.
compact_threshold = 240000
# Ollama path only (no server compaction): bound the retained conversation thread to
# roughly this many tokens (estimated, ~chars/4), dropping older turns. Also the
# reference for the console 'ctx' gauge on the local path. Ignored on the OpenAI path.
max_context_tokens = 32000

[memory]
# Cross-command memory backend. Recall is deliberate (the model calls diffbot-mcp's
# memory.recall tool itself); a backend only persists episodes after each command.
#   "none"           disabled (default)
#   "diffbot_memory" persistent Graphiti memory via diffbot-mcp's memory.remember tool
backend = "none"

[agents.openai-main]
backend = "openai"
# Use a vision-capable OpenAI model for camera image analysis.
model = "gpt-5.1"
session_id = "diffbot-main"
session_db = "diffbot-agent.sqlite3"

[agents.local-ollama]
backend = "ollama"
# Use a vision-capable local model for camera image analysis.
model = ""
base_url = ""
session_id = "diffbot-ollama"
session_db = "diffbot-agent.sqlite3"
api_key = "ollama"

[pricing."gpt-5.5"]
input_per_mtok = 5.00
output_per_mtok = 30.0

[mcp]
url = "http://localhost:8080/mcp"

[audio]
host = "localhost"
port = 50052
voice_stream_enabled = true
reconnect_delay_seconds = 2.0
