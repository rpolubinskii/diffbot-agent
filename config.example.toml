active_agent = "openai-main"

[logging]
level = "info"

[agent_runtime]
busy_policy = "ignore"
max_turns = 1000
# How many recent canonical command records the memory backend recalls per turn.
history_commands = 10000000
# OpenAI path: the Responses API compacts in-command context server-side once it
# crosses this token threshold. Ollama has no server compaction and instead keeps
# the latest `full_tool_rounds` tool rounds exact, compacting older ones locally.
compact_threshold = 240000
full_tool_rounds = 10000000

[memory]
# Cross-command memory backend:
#   "sqlite"         local recency-based records (default, offline)
#   "diffbot_memory" persistent Graphiti memory via diffbot-mcp's memory.* tools
#   "none"           disabled
backend = "sqlite"

# Optional: override the category diffbot-mcp advertises for a tool (it normally
# provides categories via each tool's MCP _meta). Categories: speech, navigation,
# safety, status, vision, tool. Use the bare operation name (after the "server__" prefix).
# [tool_categories]
# patrol_route = "navigation"

[agents.openai-main]
backend = "openai"
# Use a vision-capable OpenAI model for camera image analysis.
model = "gpt-5.1"
session_id = "diffbot-main"
session_db = "diffbot-agent.sqlite3"

[agents.local-ollama]
backend = "ollama"
# Use a vision-capable local model for camera image analysis.
model = ""
base_url = ""
session_id = "diffbot-ollama"
session_db = "diffbot-agent.sqlite3"
api_key = "ollama"

[mcp]
url = "http://localhost:8080/mcp"

[audio]
host = "localhost"
port = 50052
voice_stream_enabled = true
reconnect_delay_seconds = 2.0
