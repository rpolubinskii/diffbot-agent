active_agent = "openai-main"

[agent_runtime]
busy_policy = "ignore"

[agents.openai-main]
backend = "openai"
model = "gpt-5.1"
session_id = "diffbot-main"
session_db = "diffbot-agent.sqlite3"

[agents.local-ollama]
backend = "ollama"
model = ""
base_url = ""
session_id = "diffbot-ollama"
session_db = "diffbot-agent.sqlite3"
api_key = "ollama"

[mcp]
url = "http://localhost:8080/mcp"

[audio]
host = "localhost"
port = 50051
voice_stream_enabled = false
